[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-research-harness"
version = "0.2.0"
description = "Metadata discovery, bibliography checks, and evidence-gated research workflows"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
paperqa = ["paper-qa>=5"]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
rh = "research_harness.cli:main"

[tool.setuptools.packages.find]
include = ["research_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
